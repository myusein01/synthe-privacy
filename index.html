<!DOCTYPE html>
<!--
  PAGE TEMPORAIRE — destinée à être remplacée par l'application web Synthé.

  Pourquoi elle existe :

  La politique de confidentialité vivait à cette adresse (la racine). Elle est
  désormais à /confidentialite.html, à un chemin fixe qui ne bougera plus, pour
  que l'application web puisse prendre la racine sans lui voler son URL.

  Mais les versions DÉJÀ PUBLIÉES de l'app (jusqu'à la 1.0.1 incluse) ont
  https://myusein01.github.io/synthe-privacy/ écrit en dur dans leur binaire.
  GitHub redirige cette adresse en 301 vers la racine de synthé.app — donc ici.
  Sans cette redirection, leur lien « Politique de confidentialité » afficherait
  autre chose que la politique, ce qu'Apple exige de voir fonctionner.

  Quand la remplacer par l'app web : une fois qu'une version portant le nouveau
  PRIVACY_URL (/confidentialite.html) est publiée sur l'App Store ET que les
  versions antérieures ne sont plus significativement installées. Avant ça, la
  remplacer casse le lien légal des versions en circulation.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Politique de confidentialité — Synthé</title>
<meta http-equiv="refresh" content="0; url=./confidentialite.html">
<link rel="canonical" href="https://xn--synth-fsa.app/confidentialite.html">
<meta name="robots" content="noindex">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    color: #1c1b22;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 24px;
  }
  a { color: #5b4cff; }
</style>
</head>
<body>
<p>
  La politique de confidentialité de Synthé a été déplacée.<br>
  <a href="./confidentialite.html">Ouvrir la politique de confidentialité</a>
</p>
<script>
  // Repli si le meta refresh est ignoré (certains navigateurs intégrés le sont).
  // `replace` évite de piéger l'utilisateur dans le bouton Retour.
  location.replace('./confidentialite.html');
</script>
</body>
</html>
